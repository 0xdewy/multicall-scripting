name: test

on:
  workflow_dispatch:
    inputs:
      fork_block:
        description: Ethereum block for the release rehearsal (empty uses current)
        required: false
        type: string
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  foundry:
    name: Foundry (incl. JS + Rust FFI suites) + gas check
    runs-on: ubuntu-latest
    env:
      # optional: enables the two mainnet-fork tests in test/CallBuilder.t.sol
      ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: cd js && bun install --frozen-lockfile
      - run: cargo build --manifest-path rust/Cargo.toml -p multicall-scripter-cli
      - run: forge build --sizes
      - run: forge test -vvv
      - run: forge snapshot --fuzz-seed 0x51c7 --check --tolerance 5 --no-match-contract 'JsLibrary|RustLibrary|Invariant' --no-match-test 'test_mint_weth_and_swap'

  bun:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: cd js && bun install --frozen-lockfile
      - run: cd js && bun test

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cd rust && cargo test
      - run: cd rust && cargo clippy --all-targets -- -D warnings

  mainnet-fork:
    name: Mainnet fork deployment and protocol rehearsal
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
      # Optional. When configured, rehearse.sh runs the versioned live Enso route matrix.
      ENSO_API_KEY: ${{ secrets.ENSO_API_KEY }}
      FORK_BLOCK: ${{ inputs.fork_block }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: cd js && bun install --frozen-lockfile
      - run: forge test --match-contract Invariant -vv
        env:
          FOUNDRY_INVARIANT_RUNS: 1024
          FOUNDRY_INVARIANT_DEPTH: 512
      - run: script/rehearse.sh
